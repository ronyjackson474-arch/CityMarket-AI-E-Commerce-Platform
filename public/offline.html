<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline — CityMarket</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            text-align: center;
            padding: 24px;
        }
        .wrap { max-width: 420px; }
        .icon {
            width: 96px; height: 96px;
            background: rgba(220, 38, 38, 0.15);
            border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            animation: pulse 2s ease-in-out infinite;
        }
        .icon svg { width: 48px; height: 48px; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            background: #dc2626; color: #fff;
            padding: 14px 32px; border-radius: 999px;
            font-weight: 600; text-decoration: none;
            transition: transform .2s, box-shadow .2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(220,38,38,.4); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon">
            <svg fill="none" stroke="#dc2626" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 15l4-4 3 3 5-5" />
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>Looks like you've lost your internet connection. Check your network and try again — your cart and account are safe.</p>
        <a href="/" class="btn">Try Again</a>
    </div>
</body>
</html>
